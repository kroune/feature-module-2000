name: sync-benchmark

# Performance benchmark of an Android Studio sync of this 2000-module project
# (sized to sync within a 9 GB daemon heap, unlike the 3000-module OOM repro).
# Measures:
#   - cold sync: zero warm-ups, fresh daemon (--single-shot)
#   - warm sync: 1 warm-up + 3 measured iterations in the same IDE session
#   - CPU utilization over time (1 s samples: whole machine + per-process for the
#     Gradle/Kotlin daemons and the IDE) via tools/cpu-sampler.sh
#   - Gradle build-operation trace converted to a Perfetto trace (--build-ops-trace),
#     uploadable to https://ui.perfetto.dev
#
# Results are published as a run-<N> release (benchmark CSVs, perf-metrics.json,
# CPU time series, Perfetto traces, logs).
#
# The benchmark is manual-only: every run is expensive.
on:
  workflow_dispatch:
    inputs:
      gradle_distribution_url:
        description: "Gradle distribution zip URL (stable / RC / nightly / custom build)"
        default: "https://services.gradle.org/distributions/gradle-9.7.0-rc-1-bin.zip"
        type: string
      daemon_xmx:
        description: "Gradle daemon heap, -Xmx = -Xms (project must sync within it; 9g default)"
        default: "9g"
        type: string
      build_ops_trace:
        description: "Record the Gradle build-operation trace and publish a Perfetto trace"
        default: true
        type: boolean
      studio_url:
        description: "Android Studio linux.tar.gz URL (from jb.gg/android-studio-releases-list.json)"
        default: "https://edgedl.me.gvt1.com/android/studio/ide-zips/2026.1.2.10/android-studio-quail2-linux.tar.gz"
        type: string
      gradle_profiler_url:
        description: "gradle-profiler dist zip URL (patched build from the build-profiler workflow; upstream 0.25.2 times out waiting for the IDE plugin)"
        default: "https://github.com/kroune/feature-module-2000/releases/download/patched-profiler/gradle-profiler-0.25.2.zip"
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write # publish result releases
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "== before =="; df -h /; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      # Fixed busy-loop score: makes slow-runner outliers detectable (GitHub-hosted
      # runners vary ~10-20% in speed; see tools/runner-calib.py).
      - name: Runner speed calibration
        run: python3 tools/runner-calib.py calib.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null && SDKM=sdkmanager
          yes | "$SDKM" --licenses >/dev/null || true
          if ! ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            "$SDKM" "platforms;android-37.0"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Pin Gradle distribution
        run: |
          url='${{ inputs.gradle_distribution_url }}'
          esc=$(printf '%s' "$url" | sed 's/[&\\]/\\&/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$esc|" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Patch gradle.properties (heap cap, JDK 25 compact headers)
        run: |
          XMX='${{ inputs.daemon_xmx }}'
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xmx[0-9]+[gGmM]|-Xmx$XMX|" gradle.properties
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xms[0-9]+[gGmM]|-Xms$XMX|" gradle.properties
          sed -i "/^org.gradle.jvmargs=/ s|\$| -XX:+UseCompactObjectHeaders|" gradle.properties
          cat gradle.properties

      - name: Install gradle-profiler
        run: |
          curl -sL -o gp.zip "${{ inputs.gradle_profiler_url }}"
          mkdir -p "$RUNNER_TEMP/gp" && unzip -q gp.zip -d "$RUNNER_TEMP/gp" && rm gp.zip
          GP_BIN=$(find "$RUNNER_TEMP/gp" -type f -name gradle-profiler -path "*/bin/*" | head -1)
          echo "Found profiler at $GP_BIN"
          echo "$(dirname "$GP_BIN")" >> "$GITHUB_PATH"
          "$GP_BIN" --version

      - name: Install Android Studio
        run: |
          curl -sL -o studio.tar.gz "${{ inputs.studio_url }}"
          mkdir -p "$RUNNER_TEMP/studio"
          tar -xzf studio.tar.gz -C "$RUNNER_TEMP/studio" --strip-components=1
          rm studio.tar.gz
          ls "$RUNNER_TEMP/studio/bin"
          df -h /

      # gradle-profiler hangs forever when the daemon dies mid-sync (the TAPI call never
      # returns), so each run is wrapped in `timeout -s KILL`: if the daemon OOMs, the
      # run fails instead of burning the whole job timeout. CPU sampling runs across
      # each profiler invocation.
      - name: Run sync benchmarks (cold + warm) via gradle-profiler
        id: bench
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/guh
          # Force gradle-profiler to launch the IDE with its headless starter
          # (full-GUI Studio hangs on project frame creation on CI).
          GRADLE_PROFILER_OPTS: "-Dide.tests.headless=true"
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi

          TRACE_FLAG=()
          if [ '${{ inputs.build_ops_trace }}' = 'true' ]; then TRACE_FLAG=(--build-ops-trace); fi

          run_mode() {
            local mode="$1" timeout_min="$2"; shift 2
            mkdir -p "cpu-logs/$mode"
            tools/cpu-sampler.sh "cpu-logs/$mode" 1 &
            local sampler=$!
            timeout -s KILL "${timeout_min}m" xvfb-run -a gradle-profiler --benchmark \
              "$@" "${TRACE_FLAG[@]}" \
              --project-dir . \
              --scenario-file sync.scenarios \
              --studio-install-dir "$RUNNER_TEMP/studio" \
              --output-dir "results-$mode" \
              > "profiler-$mode.log" 2>&1
            local rc=$?
            kill -TERM $sampler 2>/dev/null || true
            sleep 2
            return $rc
          }

          run_mode cold 150 --single-shot cold-sync
          rc_cold=$?
          echo "cold sync exit code: $rc_cold"

          run_mode warm 90 warm-sync
          rc_warm=$?
          echo "warm sync exit code: $rc_warm"

          pkill -KILL -f gradle-profiler 2>/dev/null || true
          pkill -KILL -f GradleDaemon 2>/dev/null || true
          pkill -KILL -f studio 2>/dev/null || true
          echo "rc_cold=$rc_cold" >> "$GITHUB_OUTPUT"
          echo "rc_warm=$rc_warm" >> "$GITHUB_OUTPUT"
          echo "== profiler-cold.log tail =="; tail -40 profiler-cold.log || true
          echo "== profiler-warm.log tail =="; tail -40 profiler-warm.log || true
          exit 0

      - name: Build perf report
        id: report
        if: always()
        run: |
          set +e
          python3 tools/extract-metrics.py results-cold results-warm cpu-logs perf-metrics.json
          if [ -f calib.json ] && [ -f perf-metrics.json ]; then
            jq --slurpfile c calib.json '.calibration = $c[0]' perf-metrics.json > perf-metrics.tmp && mv perf-metrics.tmp perf-metrics.json
          fi
          {
            echo "## Android Studio sync performance"
            echo
            echo "- Gradle distribution: \`${{ inputs.gradle_distribution_url }}\`"
            echo "- Daemon heap: \`${{ inputs.daemon_xmx }}\` (JDK 25, \`-XX:+UseCompactObjectHeaders\`)"
            echo "- Build-ops trace: \`${{ inputs.build_ops_trace }}\`"
            echo "- Android Studio: \`${{ inputs.studio_url }}\`"
            echo "- gradle-profiler: \`${{ inputs.gradle_profiler_url }}\`"
            echo "- exit codes: cold=\`${{ steps.bench.outputs.rc_cold }}\` warm=\`${{ steps.bench.outputs.rc_warm }}\` (124/137 = timeout kill, likely daemon OOM)"
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
          } > summary.md
          for mode in cold warm; do
            [ -f "cpu-logs/$mode/system.csv" ] || continue
            echo "### $mode sync" >> summary.md
            python3 tools/cpu-summary.py "cpu-logs/$mode" >> summary.md
          done
          if [ -f calib.json ]; then
            {
              echo "### Runner calibration"
              echo
              echo '```json'
              cat calib.json
              echo '```'
              echo
            } >> summary.md
          fi
          if [ -f perf-metrics.json ]; then
            {
              echo "### Sync times (ms)"
              echo
              echo '```json'
              jq '{cold: .cold.sync, warm: .warm.sync}' perf-metrics.json
              echo '```'
            } >> summary.md
          fi
          ls -la results-cold results-warm cpu-logs/* 2>/dev/null || true
          df -h /; free -h

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-perf-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            cpu-logs/
            perf-metrics.json
            summary.md
            profiler-cold.log
            profiler-warm.log
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            results-cold/
            results-warm/

      - name: Job summary
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Results go to a release (not just artifacts): release assets have fast,
      # stable, publicly accessible download URLs — Actions artifact downloads are slow.
      - name: Publish results as a release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f summary.md ] || echo "# benchmark failed before the report step" > summary.md
          tag="run-${{ github.run_number }}"
          gver=$(basename '${{ inputs.gradle_distribution_url }}' | sed -E 's/^gradle-//; s/-(bin|all)\.zip$//')
          assets=()
          for f in perf-metrics.json summary.md profiler-cold.log profiler-warm.log \
                    sync.scenarios gradle.properties gradle/wrapper/gradle-wrapper.properties; do
            [ -f "$f" ] && assets+=("$f")
          done
          # Per-mode assets need unique names (both modes produce benchmark.csv etc.).
          for mode in cold warm; do
            for name in benchmark.csv benchmark.html; do
              src="results-$mode/$name"
              [ -f "$src" ] && cp "$src" "$mode-$name" && assets+=("$mode-$name")
            done
            ide="results-$mode/studio-sandbox/logs/idea.log"
            [ -f "$ide" ] && cp "$ide" "$mode-idea.log" && assets+=("$mode-idea.log")
          done
          # Perfetto traces + raw build-ops logs; gzip both (traces are ~800 MB, raw
          # logs several GB — ui.perfetto.dev opens gzipped traces directly).
          find results-cold results-warm -name '*-log.txt' -exec gzip -1 {} + 2>/dev/null || true
          find results-cold results-warm -name '*.perfetto.proto' -exec gzip -1 {} + 2>/dev/null || true
          # Process substitution, not a pipe: a piped while-loop runs in a subshell
          # and the assets array additions would be lost.
          while read -r f; do
            base=$(basename "$f")
            cp "$f" "$base" && assets+=("$base")
          done < <(find results-cold results-warm \( -name '*.perfetto.proto.gz' -o -name '*-log.txt.gz' \) 2>/dev/null)
          tar -czf cpu-logs.tar.gz -C cpu-logs . 2>/dev/null && assets+=(cpu-logs.tar.gz)
          if [ "${{ steps.bench.outputs.rc_cold }}" = "0" ] && [ "${{ steps.bench.outputs.rc_warm }}" = "0" ]; then
            outcome="cold + warm sync measured"
          else
            outcome="FAILED (cold rc=${{ steps.bench.outputs.rc_cold }}, warm rc=${{ steps.bench.outputs.rc_warm }})"
          fi
          gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$tag" -R '${{ github.repository }}' \
            --title "Sync perf run #${{ github.run_number }} — Gradle $gver, daemon ${{ inputs.daemon_xmx }} — $outcome" \
            --notes-file summary.md \
            "${assets[@]}"
          echo "**Results published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.bench.outputs.rc_cold }}" != "0" ]; then
            echo "FAIL: cold sync did not complete (rc=${{ steps.bench.outputs.rc_cold }}; 124/137 = timeout, likely daemon OOM at ${{ inputs.daemon_xmx }})."
            exit 1
          fi
          if [ ! -f results-cold/benchmark.csv ]; then
            echo "FAIL: cold sync finished but results-cold/benchmark.csv is missing."
            exit 1
          fi
          if [ "${{ steps.bench.outputs.rc_warm }}" != "0" ]; then
            echo "FAIL: warm sync did not complete (rc=${{ steps.bench.outputs.rc_warm }})."
            exit 1
          fi
          echo "OK: cold and warm sync measured."
          exit 0
