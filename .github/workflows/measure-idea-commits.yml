name: measure-idea-commits

# End-to-end PERFORMANCE measurement of two IntelliJ refs (typically master and a
# branch with a Gradle-sync optimization) against this 2000-module sync benchmark,
# in a single run:
#
#   resolve -> build-idea (base + candidate in parallel) -> sync (base + candidate in parallel)
#                                                        -> compare
#
# - resolve:    turns IDEA refs (branch / tag / short or full SHA) into full SHAs.
# - build-idea: builds the Gradle tooling-extension jars (toolingExtension-api +
#               toolingExtension-impl) from the IntelliJ sources via Bazel and publishes
#               them as release asset idea-tooling-<sha12>.zip under tag
#               idea-build-<sha12>. Skipped when that release already exists.
# - sync:       the same cold+warm headless Android Studio sync benchmark as
#               measure-commits (see that file: CPU sampling, build-ops trace, timeout
#               instead of the heap-dump watchdog), with the Studio-bundled
#               tooling-extension jars REPLACED by the freshly built ones (the tooling
#               extension runs inside the Gradle daemon during sync; the rest of the IDE
#               is untouched). The Gradle distribution is FIXED for both legs via
#               gradle_distribution_url, so only the IDE side differs. Publishes a
#               run-idea-<run_number>-<base|candidate> release.
# - compare:    downloads both legs' perf-metrics.json and publishes a side-by-side
#               diff as run-idea-<run_number>-perf-diff.
#
# Usage:
#   gh workflow run measure-idea-commits.yml \
#     -f base_ref=sync-baseline -f candidate_ref=sync-modern-dep-resolver
on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: "Baseline IntelliJ GitHub repo (owner/name)"
        default: "kroune/intellij-community"
        type: string
      base_ref:
        description: "Baseline IntelliJ commit SHA / branch / tag"
        default: "sync-baseline"
        type: string
      candidate_repo:
        description: "Candidate IntelliJ GitHub repo (owner/name)"
        default: "kroune/intellij-community"
        type: string
      candidate_ref:
        description: "Candidate IntelliJ commit SHA / branch / tag"
        default: "sync-modern-dep-resolver"
        type: string
      gradle_distribution_url:
        description: "Fixed Gradle bin zip URL used for BOTH legs"
        default: "https://services.gradle.org/distributions/gradle-9.7.0-rc-1-bin.zip"
        type: string
      daemon_xmx:
        description: "Gradle daemon heap, -Xmx = -Xms (project must sync within it; 9g default)"
        default: "9g"
        type: string
      build_ops_trace:
        description: "Record the Gradle build-operation trace and publish a Perfetto trace"
        default: true
        type: boolean
      studio_url:
        description: "Android Studio linux.tar.gz URL (from jb.gg/android-studio-releases-list.json)"
        default: "https://edgedl.me.gvt1.com/android/studio/ide-zips/2026.1.2.10/android-studio-quail2-linux.tar.gz"
        type: string
      gradle_profiler_url:
        description: "gradle-profiler dist zip URL (patched build from the build-profiler workflow; upstream 0.25.2 times out waiting for the IDE plugin)"
        default: "https://github.com/kroune/feature-module-2000/releases/download/patched-profiler/gradle-profiler-0.25.2.zip"
        type: string

permissions:
  contents: write # publish build + result releases

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve refs to SHAs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base_sha=$(gh api 'repos/${{ inputs.base_repo }}/commits/${{ inputs.base_ref }}' -q .sha)
          cand_sha=$(gh api 'repos/${{ inputs.candidate_repo }}/commits/${{ inputs.candidate_ref }}' -q .sha)
          echo "base:      ${{ inputs.base_repo }}@${{ inputs.base_ref }} -> $base_sha"
          echo "candidate: ${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }} -> $cand_sha"
          matrix=$(jq -nc \
            --arg br '${{ inputs.base_repo }}' --arg bs "$base_sha" \
            --arg cr '${{ inputs.candidate_repo }}' --arg cs "$cand_sha" \
            '[{name:"base",repo:$br,sha:$bs},{name:"candidate",repo:$cr,sha:$cs}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "## Resolved IntelliJ refs"
            echo
            echo "- base: \`${{ inputs.base_repo }}@${{ inputs.base_ref }}\` = \`$base_sha\`"
            echo "- candidate: \`${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}\` = \`$cand_sha\`"
            echo "- Gradle distribution (fixed for both legs): ${{ inputs.gradle_distribution_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-idea:
    needs: resolve
    runs-on: ubuntu-latest
    # A cold Bazel build of the tooling extension (incl. dependency downloads) is slow.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Release coordinates / cache check
        id: cached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          tag="idea-build-$sha12"
          echo "sha12=$sha12" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=idea-tooling-$sha12.zip" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/download/$tag/idea-tooling-$sha12.zip" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping the build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.cached.outputs.exists != 'true'
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      - uses: actions/setup-java@v4
        if: steps.cached.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Check out IntelliJ sources
        if: steps.cached.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: idea-src
          fetch-depth: 1

      - name: Build Gradle tooling-extension jars
        if: steps.cached.outputs.exists != 'true'
        working-directory: idea-src
        run: |
          ./bazel.cmd build \
            //plugins/gradle/tooling-extension-api:toolingExtension \
            //plugins/gradle/tooling-extension-impl:toolingExtension-impl

      - name: Publish jars as a release
        if: steps.cached.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bin=idea-src/out/bazel-bin
          [ -d "$bin" ] || bin=idea-src/bazel-bin
          mkdir -p dist
          cp "$bin/plugins/gradle/tooling-extension-api/toolingExtension.jar" dist/gradle-tooling-extension-api.jar
          cp "$bin/plugins/gradle/tooling-extension-impl/toolingExtension-impl.jar" dist/gradle-tooling-extension-impl.jar
          (cd dist && zip -q "../${{ steps.cached.outputs.asset }}" *.jar)
          {
            echo "## IntelliJ Gradle tooling extension built (${{ matrix.name }})"
            echo
            echo "- Source: \`${{ matrix.repo }}@${{ matrix.sha }}\`"
            echo '- Jars:'
            ls -l dist | tail -n +2 | sed 's/^/  - /'
            echo "- Asset: \`${{ steps.cached.outputs.asset }}\`"
            echo "- URL: ${{ steps.cached.outputs.url }}"
          } | tee -a "$GITHUB_STEP_SUMMARY" summary.md
          gh release delete '${{ steps.cached.outputs.tag }}' --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create '${{ steps.cached.outputs.tag }}' -R '${{ github.repository }}' \
            --title "IDEA tooling extension (${{ matrix.repo }}@${{ steps.cached.outputs.sha12 }})" \
            --notes-file summary.md \
            '${{ steps.cached.outputs.asset }}'

  # Same perf-sync logic as the sync job in measure-commits.yml — kept as a copy on
  # purpose (single self-contained workflow run). Differences: the Gradle distribution
  # is a fixed input for both legs, the Studio tooling-extension jars are overlaid from
  # the build-idea job, and release tags use the run-idea- prefix.
  sync:
    needs: [resolve, build-idea]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Compute URLs
        id: urls
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          echo "idea_url=https://github.com/${{ github.repository }}/releases/download/idea-build-$sha12/idea-tooling-$sha12.zip" >> "$GITHUB_OUTPUT"
          echo "gradle_url=${{ inputs.gradle_distribution_url }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "== before =="; df -h /; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null && SDKM=sdkmanager
          yes | "$SDKM" --licenses >/dev/null || true
          if ! ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            "$SDKM" "platforms;android-37.0"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Pin Gradle distribution
        run: |
          url='${{ steps.urls.outputs.gradle_url }}'
          esc=$(printf '%s' "$url" | sed 's/[&\\]/\\&/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$esc|" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Patch gradle.properties (heap cap, JDK 25 compact headers)
        run: |
          XMX='${{ inputs.daemon_xmx }}'
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xmx[0-9]+[gGmM]|-Xmx$XMX|" gradle.properties
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xms[0-9]+[gGmM]|-Xms$XMX|" gradle.properties
          sed -i "/^org.gradle.jvmargs=/ s|\$| -XX:+UseCompactObjectHeaders|" gradle.properties
          cat gradle.properties

      - name: Install gradle-profiler
        run: |
          curl -sL -o gp.zip "${{ inputs.gradle_profiler_url }}"
          mkdir -p "$RUNNER_TEMP/gp" && unzip -q gp.zip -d "$RUNNER_TEMP/gp" && rm gp.zip
          GP_BIN=$(find "$RUNNER_TEMP/gp" -type f -name gradle-profiler -path "*/bin/*" | head -1)
          echo "Found profiler at $GP_BIN"
          echo "$(dirname "$GP_BIN")" >> "$GITHUB_PATH"
          "$GP_BIN" --version

      - name: Install Android Studio
        run: |
          curl -sL -o studio.tar.gz "${{ inputs.studio_url }}"
          mkdir -p "$RUNNER_TEMP/studio"
          tar -xzf studio.tar.gz -C "$RUNNER_TEMP/studio" --strip-components=1
          rm studio.tar.gz
          ls "$RUNNER_TEMP/studio/bin"
          df -h /

      # The tooling extension runs inside the Gradle daemon during sync; replacing these
      # two jars is enough to swap the IDE-side dependency resolution implementation.
      - name: Overlay tooling-extension jars into Studio
        run: |
          set -euo pipefail
          curl -sL -o tooling.zip '${{ steps.urls.outputs.idea_url }}'
          mkdir -p "$RUNNER_TEMP/tooling" && unzip -q tooling.zip -d "$RUNNER_TEMP/tooling" && rm tooling.zip
          ls -l "$RUNNER_TEMP/tooling"
          for name in gradle-tooling-extension-api gradle-tooling-extension-impl; do
            target=$(find "$RUNNER_TEMP/studio/plugins" -name "$name.jar" | head -1)
            if [ -z "$target" ]; then
              echo "ERROR: $name.jar not found in the Studio installation" >&2
              exit 1
            fi
            echo "replacing $target"
            cp "$RUNNER_TEMP/tooling/$name.jar" "$target"
          done

      # gradle-profiler hangs forever when the daemon dies mid-sync (the TAPI call never
      # returns), so each run is wrapped in `timeout -s KILL`: if the daemon OOMs, the
      # run fails instead of burning the whole job timeout. CPU sampling runs across
      # each profiler invocation.
      - name: Run sync benchmarks (cold + warm) via gradle-profiler
        id: bench
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/guh
          # Force gradle-profiler to launch the IDE with its headless starter
          # (full-GUI Studio hangs on project frame creation on CI).
          GRADLE_PROFILER_OPTS: "-Dide.tests.headless=true"
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi

          TRACE_FLAG=()
          if [ '${{ inputs.build_ops_trace }}' = 'true' ]; then TRACE_FLAG=(--build-ops-trace); fi

          run_mode() {
            local mode="$1" timeout_min="$2"; shift 2
            mkdir -p "cpu-logs/$mode"
            tools/cpu-sampler.sh "cpu-logs/$mode" 1 &
            local sampler=$!
            timeout -s KILL "${timeout_min}m" xvfb-run -a gradle-profiler --benchmark \
              "$@" "${TRACE_FLAG[@]}" \
              --project-dir . \
              --scenario-file sync.scenarios \
              --studio-install-dir "$RUNNER_TEMP/studio" \
              --output-dir "results-$mode" \
              > "profiler-$mode.log" 2>&1
            local rc=$?
            kill -TERM $sampler 2>/dev/null || true
            sleep 2
            return $rc
          }

          run_mode cold 150 --single-shot cold-sync
          rc_cold=$?
          echo "cold sync exit code: $rc_cold"

          run_mode warm 90 warm-sync
          rc_warm=$?
          echo "warm sync exit code: $rc_warm"

          pkill -KILL -f gradle-profiler 2>/dev/null || true
          pkill -KILL -f GradleDaemon 2>/dev/null || true
          pkill -KILL -f studio 2>/dev/null || true
          echo "rc_cold=$rc_cold" >> "$GITHUB_OUTPUT"
          echo "rc_warm=$rc_warm" >> "$GITHUB_OUTPUT"
          echo "== profiler-cold.log tail =="; tail -40 profiler-cold.log || true
          echo "== profiler-warm.log tail =="; tail -40 profiler-warm.log || true
          exit 0

      - name: Build perf report
        id: report
        if: always()
        run: |
          set +e
          python3 tools/extract-metrics.py results-cold results-warm cpu-logs perf-metrics.json
          {
            echo "## Android Studio sync performance (${{ matrix.name }}: \`${{ matrix.repo }}@${{ matrix.sha }}\`)"
            echo
            echo "- Gradle distribution (fixed): \`${{ steps.urls.outputs.gradle_url }}\`"
            echo "- Tooling extension jars: \`${{ steps.urls.outputs.idea_url }}\`"
            echo "- Daemon heap: \`${{ inputs.daemon_xmx }}\` (JDK 25, \`-XX:+UseCompactObjectHeaders\`)"
            echo "- Build-ops trace: \`${{ inputs.build_ops_trace }}\`"
            echo "- Android Studio: \`${{ inputs.studio_url }}\`"
            echo "- gradle-profiler: \`${{ inputs.gradle_profiler_url }}\`"
            echo "- exit codes: cold=\`${{ steps.bench.outputs.rc_cold }}\` warm=\`${{ steps.bench.outputs.rc_warm }}\` (124/137 = timeout kill, likely daemon OOM)"
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
          } > summary.md
          for mode in cold warm; do
            [ -f "cpu-logs/$mode/system.csv" ] || continue
            echo "### $mode sync" >> summary.md
            python3 tools/cpu-summary.py "cpu-logs/$mode" >> summary.md
          done
          if [ -f perf-metrics.json ]; then
            {
              echo "### Sync times (ms)"
              echo
              echo '```json'
              jq '{cold: .cold.sync, warm: .warm.sync}' perf-metrics.json
              echo '```'
            } >> summary.md
          fi
          ls -la results-cold results-warm cpu-logs/* 2>/dev/null || true
          df -h /; free -h

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-sync-perf-${{ github.run_number }}-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            cpu-logs/
            perf-metrics.json
            summary.md
            profiler-cold.log
            profiler-warm.log
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            results-cold/
            results-warm/

      - name: Job summary
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Results go to a release (not just artifacts): release assets have fast,
      # stable, publicly accessible download URLs — Actions artifact downloads are slow.
      - name: Publish results as a release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f summary.md ] || echo "# benchmark failed before the report step" > summary.md
          tag="run-idea-${{ github.run_number }}-${{ matrix.name }}"
          gver=$(basename '${{ steps.urls.outputs.gradle_url }}' | sed -E 's/^gradle-//; s/-(bin|all)\.zip$//')
          assets=()
          for f in perf-metrics.json summary.md profiler-cold.log profiler-warm.log \
                    sync.scenarios gradle.properties gradle/wrapper/gradle-wrapper.properties \
                    results-cold/benchmark.csv results-cold/benchmark.html \
                    results-warm/benchmark.csv results-warm/benchmark.html \
                    results-cold/studio-sandbox/logs/idea.log results-warm/studio-sandbox/logs/idea.log; do
            [ -f "$f" ] && assets+=("$f")
          done
          # Perfetto traces + raw build-ops logs (gzip the raw logs, they can be large)
          find results-cold results-warm -name '*-log.txt' 2>/dev/null | while read -r f; do gzip -1 "$f"; done
          find results-cold results-warm \( -name '*.perfetto.proto' -o -name '*-log.txt.gz' \) 2>/dev/null | while read -r f; do
            base=$(basename "$f")
            dir=$(basename "$(dirname "$f")")
            cp "$f" "$dir-$base"
            assets+=("$dir-$base")
          done
          tar -czf cpu-logs.tar.gz -C cpu-logs . 2>/dev/null && assets+=(cpu-logs.tar.gz)
          if [ "${{ steps.bench.outputs.rc_cold }}" = "0" ] && [ "${{ steps.bench.outputs.rc_warm }}" = "0" ]; then
            outcome="cold + warm sync measured"
          else
            outcome="FAILED (cold rc=${{ steps.bench.outputs.rc_cold }}, warm rc=${{ steps.bench.outputs.rc_warm }})"
          fi
          gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$tag" -R '${{ github.repository }}' \
            --title "IDEA sync perf run #${{ github.run_number }} (${{ matrix.name }}: ${{ matrix.repo }}@$(echo '${{ matrix.sha }}' | cut -c1-12)) — Gradle $gver, daemon ${{ inputs.daemon_xmx }} — $outcome" \
            --notes-file summary.md \
            "${assets[@]}"
          echo "**Results published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.bench.outputs.rc_cold }}" != "0" ]; then
            echo "FAIL: cold sync did not complete (rc=${{ steps.bench.outputs.rc_cold }}; 124/137 = timeout, likely daemon OOM at ${{ inputs.daemon_xmx }})."
            exit 1
          fi
          if [ ! -f results-cold/benchmark.csv ]; then
            echo "FAIL: cold sync finished but results-cold/benchmark.csv is missing."
            exit 1
          fi
          if [ "${{ steps.bench.outputs.rc_warm }}" != "0" ]; then
            echo "FAIL: warm sync did not complete (rc=${{ steps.bench.outputs.rc_warm }})."
            exit 1
          fi
          echo "OK: cold and warm sync measured."
          exit 0

  # Downloads both legs' perf-metrics.json and diffs the headline numbers.
  compare:
    needs: [resolve, sync]
    runs-on: ubuntu-latest
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download leg metrics
        run: |
          set -euo pipefail
          gh release download "run-idea-${{ github.run_number }}-base" -R '${{ github.repository }}' \
            -p perf-metrics.json -O base.json --clobber
          gh release download "run-idea-${{ github.run_number }}-candidate" -R '${{ github.repository }}' \
            -p perf-metrics.json -O candidate.json --clobber

      - name: Diff metrics
        run: |
          set -euo pipefail
          python3 tools/compare-metrics.py base.json candidate.json \
            --base-label '${{ inputs.base_repo }}@${{ inputs.base_ref }}' \
            --candidate-label '${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}' \
            > compare.md
          cat compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish comparison as a release
        if: always()
        run: |
          tag="run-idea-${{ github.run_number }}-perf-diff"
          gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$tag" -R '${{ github.repository }}' \
            --title "IDEA sync perf run #${{ github.run_number }} — base vs candidate" \
            --notes-file compare.md \
            compare.md base.json candidate.json
