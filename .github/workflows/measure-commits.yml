name: measure-commits

# End-to-end PERFORMANCE comparison of two Gradle refs (typically an upstream commit
# and a fork branch with an optimization) against this 2000-module sync benchmark, in
# a single workflow run:
#
#   resolve -> build (base + candidate in parallel) -> sync (base + candidate in parallel)
#                                                    -> compare
#
# - resolve: turns refs (branch / tag / short or full SHA) into full SHAs.
# - build:   compiles the Gradle bin distribution from source (:distributions-full:
#            binDistributionZip) and publishes it as release asset gradle-<sha12>-bin.zip
#            under tag gradle-build-<sha12>. Skipped entirely when that release already
#            exists, so re-measuring the same commit is cheap.
# - sync:    the same cold+warm headless Android Studio sync benchmark as the
#            sync-benchmark workflow (see that file: CPU sampling, build-ops trace,
#            timeout instead of the heap-dump watchdog), run against the freshly built
#            distribution. Publishes a run-<run_number>-<base|candidate> release.
# - compare: downloads both legs' perf-metrics.json and publishes a side-by-side diff
#            as run-<run_number>-perf-diff.
#
# Usage:
#   gh workflow run measure-commits.yml \
#     -f base_repo=gradle/gradle -f base_ref=<sha> \
#     -f candidate_repo=kroune/gradle-fork -f candidate_ref=<branch>
on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: "Baseline GitHub repo (owner/name)"
        default: "gradle/gradle"
        type: string
      base_ref:
        description: "Baseline commit SHA / branch / tag"
        required: true
        type: string
      candidate_repo:
        description: "Candidate GitHub repo (owner/name)"
        default: "kroune/gradle-fork"
        type: string
      candidate_ref:
        description: "Candidate commit SHA / branch / tag"
        required: true
        type: string
      daemon_xmx:
        description: "Gradle daemon heap, -Xmx = -Xms (project must sync within it; 9g default)"
        default: "9g"
        type: string
      build_ops_trace:
        description: "Record the Gradle build-operation trace and publish a Perfetto trace"
        default: true
        type: boolean
      studio_url:
        description: "Android Studio linux.tar.gz URL (from jb.gg/android-studio-releases-list.json)"
        default: "https://edgedl.me.gvt1.com/android/studio/ide-zips/2026.1.2.10/android-studio-quail2-linux.tar.gz"
        type: string
      gradle_profiler_url:
        description: "gradle-profiler dist zip URL (patched build from the build-profiler workflow; upstream 0.25.2 times out waiting for the IDE plugin)"
        default: "https://github.com/kroune/feature-module-2000/releases/download/patched-profiler/gradle-profiler-0.25.2.zip"
        type: string

permissions:
  contents: write # publish distribution + result releases

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve refs to SHAs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base_sha=$(gh api 'repos/${{ inputs.base_repo }}/commits/${{ inputs.base_ref }}' -q .sha)
          cand_sha=$(gh api 'repos/${{ inputs.candidate_repo }}/commits/${{ inputs.candidate_ref }}' -q .sha)
          echo "base:      ${{ inputs.base_repo }}@${{ inputs.base_ref }} -> $base_sha"
          echo "candidate: ${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }} -> $cand_sha"
          matrix=$(jq -nc \
            --arg br '${{ inputs.base_repo }}' --arg bs "$base_sha" \
            --arg cr '${{ inputs.candidate_repo }}' --arg cs "$cand_sha" \
            '[{name:"base",repo:$br,sha:$bs},{name:"candidate",repo:$cr,sha:$cs}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "## Resolved refs"
            echo
            echo "- base: \`${{ inputs.base_repo }}@${{ inputs.base_ref }}\` = \`$base_sha\`"
            echo "- candidate: \`${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}\` = \`$cand_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    # A cold build of the full Gradle runtime on a 4-core runner is slow (~1-2 h).
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Release coordinates / cache check
        id: cached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          tag="gradle-build-$sha12"
          echo "sha12=$sha12" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=gradle-$sha12-bin.zip" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/download/$tag/gradle-$sha12-bin.zip" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping the build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.cached.outputs.exists != 'true'
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      # Gradle's own build requires JDK 25 (see its CONTRIBUTING.md); 17/21 are extra
      # toolchains in case some module pins an older language level.
      - uses: actions/setup-java@v4
        if: steps.cached.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: |
            25
            21
            17

      - name: Check out Gradle sources
        if: steps.cached.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: gradle-src
          fetch-depth: 1

      - name: Build bin distribution
        if: steps.cached.outputs.exists != 'true'
        working-directory: gradle-src
        run: |
          ./gradlew :distributions-full:binDistributionZip --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"

      - name: Publish distribution as a release
        if: steps.cached.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(ls gradle-src/packaging/distributions-full/build/distributions/gradle-*-bin.zip)
          ver=$(basename "$zip" | sed -E 's/^gradle-//; s/-bin\.zip$//')
          cp "$zip" '${{ steps.cached.outputs.asset }}'
          {
            echo "## Gradle bin distribution built (${{ matrix.name }})"
            echo
            echo "- Source: \`${{ matrix.repo }}@${{ matrix.sha }}\`"
            echo "- Version: \`$ver\`"
            echo "- Asset: \`${{ steps.cached.outputs.asset }}\` ($(stat -c%s '${{ steps.cached.outputs.asset }}') bytes)"
            echo "- Distribution URL: ${{ steps.cached.outputs.url }}"
          } | tee -a "$GITHUB_STEP_SUMMARY" summary.md
          gh release delete '${{ steps.cached.outputs.tag }}' --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create '${{ steps.cached.outputs.tag }}' -R '${{ github.repository }}' \
            --title "Gradle build $ver (${{ matrix.repo }}@${{ steps.cached.outputs.sha12 }})" \
            --notes-file summary.md \
            '${{ steps.cached.outputs.asset }}'

  # Same perf-sync logic as the sync job in sync-benchmark.yml — kept as a copy on
  # purpose (single self-contained workflow run). Differences: the distribution URL
  # comes from the build job above, and the result release tag is suffixed with the
  # matrix leg name so base/candidate don't collide.
  sync:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Compute distribution URL
        id: dist
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          echo "url=https://github.com/${{ github.repository }}/releases/download/gradle-build-$sha12/gradle-$sha12-bin.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "== before =="; df -h /; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null && SDKM=sdkmanager
          yes | "$SDKM" --licenses >/dev/null || true
          if ! ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            "$SDKM" "platforms;android-37.0"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Pin Gradle distribution
        run: |
          url='${{ steps.dist.outputs.url }}'
          esc=$(printf '%s' "$url" | sed 's/[&\\]/\\&/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$esc|" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Patch gradle.properties (heap cap, JDK 25 compact headers)
        run: |
          XMX='${{ inputs.daemon_xmx }}'
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xmx[0-9]+[gGmM]|-Xmx$XMX|" gradle.properties
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xms[0-9]+[gGmM]|-Xms$XMX|" gradle.properties
          sed -i "/^org.gradle.jvmargs=/ s|\$| -XX:+UseCompactObjectHeaders|" gradle.properties
          cat gradle.properties

      - name: Install gradle-profiler
        run: |
          curl -sL -o gp.zip "${{ inputs.gradle_profiler_url }}"
          mkdir -p "$RUNNER_TEMP/gp" && unzip -q gp.zip -d "$RUNNER_TEMP/gp" && rm gp.zip
          GP_BIN=$(find "$RUNNER_TEMP/gp" -type f -name gradle-profiler -path "*/bin/*" | head -1)
          echo "Found profiler at $GP_BIN"
          echo "$(dirname "$GP_BIN")" >> "$GITHUB_PATH"
          "$GP_BIN" --version

      - name: Install Android Studio
        run: |
          curl -sL -o studio.tar.gz "${{ inputs.studio_url }}"
          mkdir -p "$RUNNER_TEMP/studio"
          tar -xzf studio.tar.gz -C "$RUNNER_TEMP/studio" --strip-components=1
          rm studio.tar.gz
          ls "$RUNNER_TEMP/studio/bin"
          df -h /

      # gradle-profiler hangs forever when the daemon dies mid-sync (the TAPI call never
      # returns), so each run is wrapped in `timeout -s KILL`: if the daemon OOMs, the
      # run fails instead of burning the whole job timeout. CPU sampling runs across
      # each profiler invocation.
      - name: Run sync benchmarks (cold + warm) via gradle-profiler
        id: bench
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/guh
          # Force gradle-profiler to launch the IDE with its headless starter
          # (full-GUI Studio hangs on project frame creation on CI).
          GRADLE_PROFILER_OPTS: "-Dide.tests.headless=true"
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi

          TRACE_FLAG=()
          if [ '${{ inputs.build_ops_trace }}' = 'true' ]; then TRACE_FLAG=(--build-ops-trace); fi

          run_mode() {
            local mode="$1" timeout_min="$2"; shift 2
            mkdir -p "cpu-logs/$mode"
            tools/cpu-sampler.sh "cpu-logs/$mode" 1 &
            local sampler=$!
            timeout -s KILL "${timeout_min}m" xvfb-run -a gradle-profiler --benchmark \
              "$@" "${TRACE_FLAG[@]}" \
              --project-dir . \
              --scenario-file sync.scenarios \
              --studio-install-dir "$RUNNER_TEMP/studio" \
              --output-dir "results-$mode" \
              > "profiler-$mode.log" 2>&1
            local rc=$?
            kill -TERM $sampler 2>/dev/null || true
            sleep 2
            return $rc
          }

          run_mode cold 150 --single-shot cold-sync
          rc_cold=$?
          echo "cold sync exit code: $rc_cold"

          run_mode warm 90 warm-sync
          rc_warm=$?
          echo "warm sync exit code: $rc_warm"

          pkill -KILL -f gradle-profiler 2>/dev/null || true
          pkill -KILL -f GradleDaemon 2>/dev/null || true
          pkill -KILL -f studio 2>/dev/null || true
          echo "rc_cold=$rc_cold" >> "$GITHUB_OUTPUT"
          echo "rc_warm=$rc_warm" >> "$GITHUB_OUTPUT"
          echo "== profiler-cold.log tail =="; tail -40 profiler-cold.log || true
          echo "== profiler-warm.log tail =="; tail -40 profiler-warm.log || true
          exit 0

      - name: Build perf report
        id: report
        if: always()
        run: |
          set +e
          python3 tools/extract-metrics.py results-cold results-warm cpu-logs perf-metrics.json
          {
            echo "## Android Studio sync performance (${{ matrix.name }}: \`${{ matrix.repo }}@${{ matrix.sha }}\`)"
            echo
            echo "- Gradle distribution: \`${{ steps.dist.outputs.url }}\`"
            echo "- Daemon heap: \`${{ inputs.daemon_xmx }}\` (JDK 25, \`-XX:+UseCompactObjectHeaders\`)"
            echo "- Build-ops trace: \`${{ inputs.build_ops_trace }}\`"
            echo "- Android Studio: \`${{ inputs.studio_url }}\`"
            echo "- gradle-profiler: \`${{ inputs.gradle_profiler_url }}\`"
            echo "- exit codes: cold=\`${{ steps.bench.outputs.rc_cold }}\` warm=\`${{ steps.bench.outputs.rc_warm }}\` (124/137 = timeout kill, likely daemon OOM)"
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
          } > summary.md
          for mode in cold warm; do
            [ -f "cpu-logs/$mode/system.csv" ] || continue
            echo "### $mode sync" >> summary.md
            python3 tools/cpu-summary.py "cpu-logs/$mode" >> summary.md
          done
          if [ -f perf-metrics.json ]; then
            {
              echo "### Sync times (ms)"
              echo
              echo '```json'
              jq '{cold: .cold.sync, warm: .warm.sync}' perf-metrics.json
              echo '```'
            } >> summary.md
          fi
          ls -la results-cold results-warm cpu-logs/* 2>/dev/null || true
          df -h /; free -h

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-perf-${{ github.run_number }}-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            cpu-logs/
            perf-metrics.json
            summary.md
            profiler-cold.log
            profiler-warm.log
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            results-cold/
            results-warm/

      - name: Job summary
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Results go to a release (not just artifacts): release assets have fast,
      # stable, publicly accessible download URLs — Actions artifact downloads are slow.
      - name: Publish results as a release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f summary.md ] || echo "# benchmark failed before the report step" > summary.md
          tag="run-${{ github.run_number }}-${{ matrix.name }}"
          gver=$(basename '${{ steps.dist.outputs.url }}' | sed -E 's/^gradle-//; s/-(bin|all)\.zip$//')
          assets=()
          for f in perf-metrics.json summary.md profiler-cold.log profiler-warm.log \
                    sync.scenarios gradle.properties gradle/wrapper/gradle-wrapper.properties; do
            [ -f "$f" ] && assets+=("$f")
          done
          # Per-mode assets need unique names (both modes produce benchmark.csv etc.).
          for mode in cold warm; do
            for name in benchmark.csv benchmark.html; do
              src="results-$mode/$name"
              [ -f "$src" ] && cp "$src" "$mode-$name" && assets+=("$mode-$name")
            done
            ide="results-$mode/studio-sandbox/logs/idea.log"
            [ -f "$ide" ] && cp "$ide" "$mode-idea.log" && assets+=("$mode-idea.log")
          done
          # Perfetto traces + raw build-ops logs; gzip both (traces are ~800 MB, raw
          # logs several GB — ui.perfetto.dev opens gzipped traces directly).
          find results-cold results-warm -name '*-log.txt' -exec gzip -1 {} + 2>/dev/null || true
          find results-cold results-warm -name '*.perfetto.proto' -exec gzip -1 {} + 2>/dev/null || true
          # Process substitution, not a pipe: a piped while-loop runs in a subshell
          # and the assets array additions would be lost.
          while read -r f; do
            base=$(basename "$f")
            cp "$f" "$base" && assets+=("$base")
          done < <(find results-cold results-warm \( -name '*.perfetto.proto.gz' -o -name '*-log.txt.gz' \) 2>/dev/null)
          tar -czf cpu-logs.tar.gz -C cpu-logs . 2>/dev/null && assets+=(cpu-logs.tar.gz)
          if [ "${{ steps.bench.outputs.rc_cold }}" = "0" ] && [ "${{ steps.bench.outputs.rc_warm }}" = "0" ]; then
            outcome="cold + warm sync measured"
          else
            outcome="FAILED (cold rc=${{ steps.bench.outputs.rc_cold }}, warm rc=${{ steps.bench.outputs.rc_warm }})"
          fi
          gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$tag" -R '${{ github.repository }}' \
            --title "Sync perf run #${{ github.run_number }} (${{ matrix.name }}: ${{ matrix.repo }}@$(echo '${{ matrix.sha }}' | cut -c1-12)) — Gradle $gver, daemon ${{ inputs.daemon_xmx }} — $outcome" \
            --notes-file summary.md \
            "${assets[@]}"
          echo "**Results published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.bench.outputs.rc_cold }}" != "0" ]; then
            echo "FAIL: cold sync did not complete (rc=${{ steps.bench.outputs.rc_cold }}; 124/137 = timeout, likely daemon OOM at ${{ inputs.daemon_xmx }})."
            exit 1
          fi
          if [ ! -f results-cold/benchmark.csv ]; then
            echo "FAIL: cold sync finished but results-cold/benchmark.csv is missing."
            exit 1
          fi
          if [ "${{ steps.bench.outputs.rc_warm }}" != "0" ]; then
            echo "FAIL: warm sync did not complete (rc=${{ steps.bench.outputs.rc_warm }})."
            exit 1
          fi
          echo "OK: cold and warm sync measured."
          exit 0

  # Downloads both legs' perf-metrics.json and diffs the headline numbers.
  compare:
    needs: [resolve, sync]
    runs-on: ubuntu-latest
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download leg metrics
        run: |
          set -euo pipefail
          gh release download "run-${{ github.run_number }}-base" -R '${{ github.repository }}' \
            -p perf-metrics.json -O base.json --clobber
          gh release download "run-${{ github.run_number }}-candidate" -R '${{ github.repository }}' \
            -p perf-metrics.json -O candidate.json --clobber

      - name: Diff metrics
        run: |
          set -euo pipefail
          python3 tools/compare-metrics.py base.json candidate.json \
            --base-label '${{ inputs.base_repo }}@${{ inputs.base_ref }}' \
            --candidate-label '${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}' \
            > compare.md
          cat compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish comparison as a release
        if: always()
        run: |
          tag="run-${{ github.run_number }}-perf-diff"
          gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$tag" -R '${{ github.repository }}' \
            --title "Sync perf run #${{ github.run_number }} — base vs candidate" \
            --notes-file compare.md \
            compare.md base.json candidate.json
