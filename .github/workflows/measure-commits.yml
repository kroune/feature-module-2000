name: measure-commits

# End-to-end PERFORMANCE comparison of two Gradle refs (typically an upstream commit
# and a fork branch with an optimization) against this 2000-module sync benchmark, in
# a single workflow run:
#
#   resolve -> build (base + candidate in parallel) -> sync (BOTH LEGS ON ONE RUNNER)
#
# - resolve: turns refs (branch / tag / short or full SHA) into full SHAs.
# - build:   compiles the Gradle bin distribution from source (:distributions-full:
#            binDistributionZip) and publishes it as release asset gradle-<sha12>-bin.zip
#            under tag gradle-build-<sha12>. Skipped entirely when that release already
#            exists, so re-measuring the same commit is cheap.
# - sync:    ONE job runs both legs on the same runner — machine-speed variance between
#            hosted runners (observed ~20%) cancels out. Accuracy design (measured in a
#            same-ref self-test on this repo): a single cold sync per leg still carries
#            ~25% leg-order/session noise, so each leg gets TWO cold syncs with fresh
#            daemons, INTERLEAVED (base1, cand1, base2, cand2), preceded by a throwaway
#            PRIMER sync that absorbs the one-time first-run costs (dist + dependency
#            downloads into the profiler-managed shared Gradle user home), then one warm
#            scenario per leg (1 warm-up + 3 measured iterations). CPU is sampled at 1 s
#            across every run; build-ops/Perfetto traces are recorded per run.
#            Publishes run-<run_number>-<base|candidate> releases and a
#            run-<run_number>-perf-diff comparison release.
#
# Usage:
#   gh workflow run measure-commits.yml \
#     -f base_repo=gradle/gradle -f base_ref=<sha> \
#     -f candidate_repo=kroune/gradle-fork -f candidate_ref=<branch>
on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: "Baseline GitHub repo (owner/name)"
        default: "gradle/gradle"
        type: string
      base_ref:
        description: "Baseline commit SHA / branch / tag"
        required: true
        type: string
      candidate_repo:
        description: "Candidate GitHub repo (owner/name)"
        default: "kroune/gradle-fork"
        type: string
      candidate_ref:
        description: "Candidate commit SHA / branch / tag"
        required: true
        type: string
      daemon_xmx:
        description: "Gradle daemon heap, -Xmx = -Xms (project must sync within it; 9g default)"
        default: "9g"
        type: string
      build_ops_trace:
        description: "Record the Gradle build-operation trace and publish a Perfetto trace"
        default: true
        type: boolean
      studio_url:
        description: "Android Studio linux.tar.gz URL (from jb.gg/android-studio-releases-list.json)"
        default: "https://edgedl.me.gvt1.com/android/studio/ide-zips/2026.1.2.10/android-studio-quail2-linux.tar.gz"
        type: string
      gradle_profiler_url:
        description: "gradle-profiler dist zip URL (patched build from the build-profiler workflow; upstream 0.25.2 times out waiting for the IDE plugin)"
        default: "https://github.com/kroune/feature-module-2000/releases/download/patched-profiler/gradle-profiler-0.25.2.zip"
        type: string

permissions:
  contents: write # publish distribution + result releases

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - name: Resolve refs to SHAs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base_sha=$(gh api 'repos/${{ inputs.base_repo }}/commits/${{ inputs.base_ref }}' -q .sha)
          cand_sha=$(gh api 'repos/${{ inputs.candidate_repo }}/commits/${{ inputs.candidate_ref }}' -q .sha)
          echo "base:      ${{ inputs.base_repo }}@${{ inputs.base_ref }} -> $base_sha"
          echo "candidate: ${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }} -> $cand_sha"
          matrix=$(jq -nc \
            --arg br '${{ inputs.base_repo }}' --arg bs "$base_sha" \
            --arg cr '${{ inputs.candidate_repo }}' --arg cs "$cand_sha" \
            '[{name:"base",repo:$br,sha:$bs},{name:"candidate",repo:$cr,sha:$cs}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$cand_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Resolved refs"
            echo
            echo "- base: \`${{ inputs.base_repo }}@${{ inputs.base_ref }}\` = \`$base_sha\`"
            echo "- candidate: \`${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}\` = \`$cand_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    # A cold build of the full Gradle runtime on a 4-core runner is slow (~1-2 h).
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Release coordinates / cache check
        id: cached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          tag="gradle-build-$sha12"
          echo "sha12=$sha12" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=gradle-$sha12-bin.zip" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/download/$tag/gradle-$sha12-bin.zip" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping the build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.cached.outputs.exists != 'true'
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      # Gradle's own build requires JDK 25 (see its CONTRIBUTING.md); 17/21 are extra
      # toolchains in case some module pins an older language level.
      - uses: actions/setup-java@v4
        if: steps.cached.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: |
            25
            21
            17

      - name: Check out Gradle sources
        if: steps.cached.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: gradle-src
          fetch-depth: 1

      - name: Build bin distribution
        if: steps.cached.outputs.exists != 'true'
        working-directory: gradle-src
        run: |
          ./gradlew :distributions-full:binDistributionZip --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"

      - name: Publish distribution as a release
        if: steps.cached.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(ls gradle-src/packaging/distributions-full/build/distributions/gradle-*-bin.zip)
          ver=$(basename "$zip" | sed -E 's/^gradle-//; s/-bin\.zip$//')
          cp "$zip" '${{ steps.cached.outputs.asset }}'
          {
            echo "## Gradle bin distribution built (${{ matrix.name }})"
            echo
            echo "- Source: \`${{ matrix.repo }}@${{ matrix.sha }}\`"
            echo "- Version: \`$ver\`"
            echo "- Asset: \`${{ steps.cached.outputs.asset }}\` ($(stat -c%s '${{ steps.cached.outputs.asset }}') bytes)"
            echo "- Distribution URL: ${{ steps.cached.outputs.url }}"
          } | tee -a "$GITHUB_STEP_SUMMARY" summary.md
          gh release delete '${{ steps.cached.outputs.tag }}' --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create '${{ steps.cached.outputs.tag }}' -R '${{ github.repository }}' \
            --title "Gradle build $ver (${{ matrix.repo }}@${{ steps.cached.outputs.sha12 }})" \
            --notes-file summary.md \
            '${{ steps.cached.outputs.asset }}'

  # Both legs run on THIS runner: identical machine speed, so the comparison isolates
  # the Gradle change. A throwaway primer sync absorbs the one-time first-run costs
  # (dist + dependency downloads into the profiler-managed shared Gradle user home),
  # then every cold sync starts with a fresh daemon and no leftover processes, and the
  # legs interleave (base1, cand1, base2, cand2) so any within-job machine-speed drift
  # hits both legs equally. The perf diff is computed in-job — both legs' metrics are
  # local files here.
  sync:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "== before =="; df -h /; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      # Fixed busy-loop score: documents this runner's speed (see tools/runner-calib.py).
      - name: Runner speed calibration
        run: python3 tools/runner-calib.py calib.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null && SDKM=sdkmanager
          yes | "$SDKM" --licenses >/dev/null || true
          if ! ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            "$SDKM" "platforms;android-37.0"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Install gradle-profiler
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 10 -o gp.zip "${{ inputs.gradle_profiler_url }}"
          mkdir -p "$RUNNER_TEMP/gp" && unzip -q gp.zip -d "$RUNNER_TEMP/gp" && rm gp.zip
          GP_BIN=$(find "$RUNNER_TEMP/gp" -type f -name gradle-profiler -path "*/bin/*" | head -1)
          echo "Found profiler at $GP_BIN"
          echo "$(dirname "$GP_BIN")" >> "$GITHUB_PATH"
          "$GP_BIN" --version

      - name: Install Android Studio
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 10 -C - -o studio.tar.gz "${{ inputs.studio_url }}"
          mkdir -p "$RUNNER_TEMP/studio"
          tar -xzf studio.tar.gz -C "$RUNNER_TEMP/studio" --strip-components=1
          rm studio.tar.gz
          # Canary/preview builds dynamically attach Studio's ThreadingChecker agent
          # (DebugFlag studio.diagnostic.threading.agent.enable defaults on there) —
          # bytecode instrumentation that made the IDE side ~6x slower on this project.
          # Release builds never attach it. Deleting the jar disables the dynamic attach
          # (the loader warns and continues), keeping canary behavior close to release.
          rm -f "$RUNNER_TEMP/studio/plugins/android/resources/threading_agent.jar"
          ls "$RUNNER_TEMP/studio/bin"
          df -h /

      # gradle-profiler hangs forever when the daemon dies mid-sync (the TAPI call never
      # returns), so each run is wrapped in `timeout -s KILL`: if the daemon OOMs, the
      # run fails instead of burning the whole job timeout. CPU sampling runs across
      # each profiler invocation.
      - name: Run benchmarks for base and candidate on this runner
        id: bench
        env:
          # Force gradle-profiler to launch the IDE with its headless starter
          # (full-GUI Studio hangs on project frame creation on CI).
          GRADLE_PROFILER_OPTS: "-Dide.tests.headless=true"
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          XMX='${{ inputs.daemon_xmx }}'
          TRACE_FLAG=()
          [ '${{ inputs.build_ops_trace }}' = 'true' ] && TRACE_FLAG=(--build-ops-trace)

          pin_leg_config() {
            local leg="$1" sha url esc
            if [ "$leg" = base ]; then sha='${{ needs.resolve.outputs.base_sha }}'; else sha='${{ needs.resolve.outputs.candidate_sha }}'; fi
            local sha12=$(echo "$sha" | cut -c1-12)
            url="https://github.com/${{ github.repository }}/releases/download/gradle-build-$sha12/gradle-$sha12-bin.zip"
            echo "--- pinning $leg: $sha ($url)"
            esc=$(printf '%s' "$url" | sed 's/[&\\]/\\&/g')
            sed -i "s|^distributionUrl=.*|distributionUrl=$esc|" gradle/wrapper/gradle-wrapper.properties
            sed -i -E "/^org.gradle.jvmargs=/ s|-Xmx[0-9]+[gGmM]|-Xmx$XMX|" gradle.properties
            sed -i -E "/^org.gradle.jvmargs=/ s|-Xms[0-9]+[gGmM]|-Xms$XMX|" gradle.properties
            grep -q UseCompactObjectHeaders gradle.properties || \
              sed -i "/^org.gradle.jvmargs=/ s|\$| -XX:+UseCompactObjectHeaders|" gradle.properties
          }

          reset_to_cold() {
            pkill -KILL -f gradle-profiler 2>/dev/null
            pkill -KILL -f GradleDaemon 2>/dev/null
            pkill -KILL -f studio 2>/dev/null
            sleep 5
          }

          run_profiler() {
            local leg="$1" tag="$2" timeout_min="$3"; shift 3
            mkdir -p "cpu-logs/$leg-$tag"
            tools/cpu-sampler.sh "cpu-logs/$leg-$tag" 1 &
            local sampler=$!
            timeout -s KILL "${timeout_min}m" xvfb-run -a gradle-profiler --benchmark \
              "$@" "${TRACE_FLAG[@]}" \
              --project-dir . \
              --scenario-file sync.scenarios \
              --studio-install-dir "$RUNNER_TEMP/studio" \
              --output-dir "results-$leg-$tag" \
              > "profiler-$leg-$tag.log" 2>&1
            local rc=$?
            kill -TERM $sampler 2>/dev/null
            sleep 2
            echo "rc_${leg}_${tag}=$rc" >> "$GITHUB_OUTPUT"
            echo "leg=$leg run=$tag rc=$rc"
            return $rc
          }

          # "Cold" = fresh daemon and cold JVMs (--single-shot implies --cold-daemon),
          # no leftover processes. Note: gradle-profiler manages the Gradle user home
          # itself (<project>/gradle-user-home, shared by every run of the job), so the
          # first sync of the job pays ALL one-time costs — wrapper dist download,
          # dependency downloads, artifact instrumentation (~116s at 100 modules,
          # observed in build-ops traces). The throwaway primer run below absorbs that
          # penalty so no MEASURED leg is polluted by it; afterwards every cold leg
          # sees the same warm dependency cache and they stay comparable.
          run_cold() {
            local leg="$1" idx="$2"
            pin_leg_config "$leg"
            reset_to_cold
            run_profiler "$leg" "cold$idx" 45 --single-shot cold-sync
          }

          # Warm sync: the scenario's own warm-up iteration handles daemon/IDE warmup.
          run_warm() {
            local leg="$1"
            pin_leg_config "$leg"
            reset_to_cold
            run_profiler "$leg" warm 45 warm-sync
          }

          # Throwaway primer (base config, results discarded): absorbs the one-time
          # first-run costs described above. Not published, not part of the metrics.
          pin_leg_config base
          reset_to_cold
          run_profiler primer primer 45 --single-shot cold-sync || echo "primer sync failed (rc=$?) — continuing, first measured leg will absorb the warmup"

          run_cold base 1
          run_cold candidate 1
          run_cold base 2
          run_cold candidate 2
          run_warm base
          run_warm candidate
          reset_to_cold
          for f in profiler-*.log; do echo "== $f tail =="; tail -20 "$f"; done
          exit 0

      - name: Build perf reports and comparison
        id: report
        if: always()
        run: |
          set +e
          for leg in base candidate; do
            python3 tools/extract-metrics.py perf-metrics-$leg.json \
              --cold results-$leg-cold1 results-$leg-cold2 \
              --warm results-$leg-warm \
              --cpu-cold cpu-logs/$leg-cold1 cpu-logs/$leg-cold2 \
              --cpu-warm cpu-logs/$leg-warm
            if [ -f calib.json ] && [ -f perf-metrics-$leg.json ]; then
              jq --slurpfile c calib.json '.calibration = $c[0]' perf-metrics-$leg.json > pm.tmp && mv pm.tmp perf-metrics-$leg.json
            fi
          done
          {
            echo "## Android Studio sync performance comparison"
            echo
            echo "- base: \`${{ inputs.base_repo }}@${{ inputs.base_ref }}\` (\`${{ needs.resolve.outputs.base_sha }}\`)"
            echo "- candidate: \`${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}\` (\`${{ needs.resolve.outputs.candidate_sha }}\`)"
            echo "- Daemon heap: \`${{ inputs.daemon_xmx }}\` (JDK 25, \`-XX:+UseCompactObjectHeaders\`)"
            echo "- Build-ops trace: \`${{ inputs.build_ops_trace }}\`"
            echo "- Both legs ran on the SAME runner, cold syncs interleaved (base1, cand1, base2, cand2)"
            echo "- exit codes (124/137 = timeout kill, likely daemon OOM):"
            echo "  - base: cold1=\`${{ steps.bench.outputs.rc_base_cold1 }}\` cold2=\`${{ steps.bench.outputs.rc_base_cold2 }}\` warm=\`${{ steps.bench.outputs.rc_base_warm }}\`"
            echo "  - candidate: cold1=\`${{ steps.bench.outputs.rc_candidate_cold1 }}\` cold2=\`${{ steps.bench.outputs.rc_candidate_cold2 }}\` warm=\`${{ steps.bench.outputs.rc_candidate_warm }}\`"
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
          } > summary.md
          if [ -f calib.json ]; then
            { echo "### Runner calibration"; echo; echo '```json'; cat calib.json; echo '```'; echo; } >> summary.md
          fi
          if [ -f perf-metrics-base.json ] && [ -f perf-metrics-candidate.json ]; then
            python3 tools/compare-metrics.py perf-metrics-base.json perf-metrics-candidate.json \
              --base-label '${{ inputs.base_repo }}@${{ inputs.base_ref }}' \
              --candidate-label '${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}' \
              > compare.md
            cat compare.md >> summary.md
          fi
          for leg in base candidate; do
            for mode in cold1 cold2 warm; do
              [ -f "cpu-logs/$leg-$mode/system.csv" ] || continue
              echo "### $leg $mode sync" >> summary.md
              python3 tools/cpu-summary.py "cpu-logs/$leg-$mode" >> summary.md
            done
          done
          ls -la results-* cpu-logs/* 2>/dev/null || true
          df -h /; free -h

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-perf-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            cpu-logs/
            perf-metrics-base.json
            perf-metrics-candidate.json
            compare.md
            summary.md
            profiler-*.log
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            results-base-cold1/
            results-base-cold2/
            results-base-warm/
            results-candidate-cold1/
            results-candidate-cold2/
            results-candidate-warm/

      - name: Job summary
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Results go to releases (not just artifacts): release assets have fast,
      # stable, publicly accessible download URLs — Actions artifact downloads are slow.
      - name: Publish results as releases
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f summary.md ] || echo "# benchmark failed before the report step" > summary.md

          # Perfetto traces + raw build-ops logs; gzip both (traces are ~800 MB, raw
          # logs several GB — ui.perfetto.dev opens gzipped traces directly).
          find results-base-cold1 results-base-cold2 results-base-warm \
               results-candidate-cold1 results-candidate-cold2 results-candidate-warm \
            -name '*-log.txt' -exec gzip -1 {} + 2>/dev/null || true
          find results-base-cold1 results-base-cold2 results-base-warm \
               results-candidate-cold1 results-candidate-cold2 results-candidate-warm \
            -name '*.perfetto.proto' -exec gzip -1 {} + 2>/dev/null || true

          publish_leg() {
            local leg="$1" title_leg="$2" rc_c1="$3" rc_c2="$4" rc_w="$5"
            local tag="run-${{ github.run_number }}-$leg"
            local assets=()
            for f in perf-metrics-$leg.json profiler-$leg-cold1.log profiler-$leg-cold2.log profiler-$leg-warm.log; do
              [ -f "$f" ] && assets+=("$f")
            done
            for mode in cold1 cold2 warm; do
              for name in benchmark.csv benchmark.html; do
                local src="results-$leg-$mode/$name"
                [ -f "$src" ] && cp "$src" "$leg-$mode-$name" && assets+=("$leg-$mode-$name")
              done
              local ide="results-$leg-$mode/studio-sandbox/logs/idea.log"
              [ -f "$ide" ] && cp "$ide" "$leg-$mode-idea.log" && assets+=("$leg-$mode-idea.log")
              # Process substitution, not a pipe: a piped while-loop runs in a
              # subshell and the assets array additions would be lost.
              while read -r f; do
                local base=$(basename "$f")
                cp "$f" "$leg-$mode-$base" && assets+=("$leg-$mode-$base")
              done < <(find "results-$leg-$mode" \( -name '*.perfetto.proto.gz' -o -name '*-log.txt.gz' \) 2>/dev/null)
            done
            local outcome="cold x2 + warm sync measured"
            [ "$rc_c1" = "0" ] && [ "$rc_c2" = "0" ] && [ "$rc_w" = "0" ] || outcome="FAILED (cold1 rc=$rc_c1, cold2 rc=$rc_c2, warm rc=$rc_w)"
            gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
            gh release create "$tag" -R '${{ github.repository }}' \
              --title "Sync perf run #${{ github.run_number }} ($title_leg) — daemon ${{ inputs.daemon_xmx }} — $outcome" \
              --notes-file summary.md \
              "${assets[@]}"
          }

          publish_leg base '${{ inputs.base_repo }}@${{ inputs.base_ref }}' \
            '${{ steps.bench.outputs.rc_base_cold1 }}' '${{ steps.bench.outputs.rc_base_cold2 }}' '${{ steps.bench.outputs.rc_base_warm }}'
          publish_leg candidate '${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}' \
            '${{ steps.bench.outputs.rc_candidate_cold1 }}' '${{ steps.bench.outputs.rc_candidate_cold2 }}' '${{ steps.bench.outputs.rc_candidate_warm }}'

          tar -czf cpu-logs.tar.gz -C cpu-logs . 2>/dev/null || true
          diff_tag="run-${{ github.run_number }}-perf-diff"
          diff_assets=(summary.md)
          [ -f compare.md ] && diff_assets+=(compare.md)
          [ -f perf-metrics-base.json ] && diff_assets+=(perf-metrics-base.json)
          [ -f perf-metrics-candidate.json ] && diff_assets+=(perf-metrics-candidate.json)
          [ -f cpu-logs.tar.gz ] && diff_assets+=(cpu-logs.tar.gz)
          gh release delete "$diff_tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$diff_tag" -R '${{ github.repository }}' \
            --title "Sync perf run #${{ github.run_number }} — base vs candidate" \
            --notes-file summary.md \
            "${diff_assets[@]}"
          echo "**Results published: run-${{ github.run_number }}-{base,candidate,perf-diff}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          failed=0
          rc_bc1='${{ steps.bench.outputs.rc_base_cold1 }}'
          rc_bc2='${{ steps.bench.outputs.rc_base_cold2 }}'
          rc_bw='${{ steps.bench.outputs.rc_base_warm }}'
          rc_cc1='${{ steps.bench.outputs.rc_candidate_cold1 }}'
          rc_cc2='${{ steps.bench.outputs.rc_candidate_cold2 }}'
          rc_cw='${{ steps.bench.outputs.rc_candidate_warm }}'
          for pair in "base cold1 $rc_bc1" "base cold2 $rc_bc2" "base warm $rc_bw" \
                      "candidate cold1 $rc_cc1" "candidate cold2 $rc_cc2" "candidate warm $rc_cw"; do
            set -- $pair
            if [ "$3" != "0" ]; then echo "FAIL: $1 $2 sync did not complete (rc=$3; 124/137 = timeout, likely daemon OOM at ${{ inputs.daemon_xmx }})"; failed=1; fi
            if [ "$3" = "0" ] && [ ! -f "results-$1-$2/benchmark.csv" ]; then echo "FAIL: $1 $2 finished but benchmark.csv is missing"; failed=1; fi
          done
          [ "$failed" = 0 ] && echo "OK: both legs measured (2x cold + warm) on one runner."
          exit $failed
